<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rashida Mark — Product Marketing Leader</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream: #f0f4f8;
    --warm-white: #f8fafc;
    --brown: #5b4fa0;
    --brown-light: #7b6fc0;
    --brown-dark: #1e1b3a;
    --text: #0f0e1f;
    --text-soft: #4a5568;
    --accent: #2abfbf;
    --border: rgba(42,191,191,0.18);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    background-image: radial-gradient(ellipse at 80% 10%, rgba(144,187,220,0.13) 0%, transparent 50%),
                      radial-gradient(ellipse at 10% 90%, rgba(91,79,160,0.07) 0%, transparent 50%);
    color: var(--text);
    overflow-x: hidden;
  }

  /* ─── NAV ─── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.25rem 3rem;
    background: rgba(240,244,248,0.88);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .nav-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--brown-dark);
    text-decoration: none;
  }
  .nav-links { display: flex; gap: 2.25rem; list-style: none; }
  .nav-links a {
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-soft);
    text-decoration: none;
    transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--accent); }

  /* ─── HERO ─── */
  #hero {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
    position: relative;
    overflow: hidden;
  }
  .hero-left {
    background: var(--brown-dark);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 5rem 4rem;
    position: relative;
    overflow: hidden;
  }
  .hero-left::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 30% 60%, rgba(91,79,160,0.35) 0%, transparent 65%);
    pointer-events: none;
  }
  .hero-eyebrow {
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1.5rem;
    opacity: 0;
    animation: fadeUp 0.8s 0.2s forwards;
  }
  .hero-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(3.5rem, 6vw, 5.5rem);
    font-weight: 300;
    line-height: 1.0;
    color: var(--cream);
    margin-bottom: 1.75rem;
    opacity: 0;
    animation: fadeUp 0.8s 0.35s forwards;
  }
  .hero-name em {
    font-style: italic;
    color: var(--accent);
  }
  .hero-tagline {
    font-size: 0.88rem;
    font-weight: 300;
    letter-spacing: 0.08em;
    color: rgba(245,240,232,0.55);
    text-transform: uppercase;
    opacity: 0;
    animation: fadeUp 0.8s 0.5s forwards;
  }

  .hero-right {
    background: var(--warm-white);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 5rem 5rem 5rem 6rem;
    position: relative;
  }
  .hero-right::before {
    content: '';
    position: absolute;
    top: 8%; right: 8%;
    width: 280px; height: 280px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(42,191,191,0.08) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-desc {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.25rem, 2vw, 1.55rem);
    font-weight: 300;
    line-height: 1.65;
    color: var(--text);
    margin-bottom: 3.5rem;
    opacity: 0;
    animation: fadeUp 0.8s 0.6s forwards;
  }
  .hero-stats {
    display: flex;
    gap: 2.5rem;
    opacity: 0;
    animation: fadeUp 0.8s 0.75s forwards;
  }
  .stat-item {
    border-left: 2px solid var(--accent);
    padding-left: 1rem;
  }
  .stat-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem;
    font-weight: 600;
    color: var(--brown);
    line-height: 1;
    margin-bottom: 0.25rem;
  }
  .stat-label {
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-soft);
  }

  /* ─── SECTION WRAPPER ─── */
  section {
    padding: 7rem 0;
  }
  .container {
    max-width: 1140px;
    margin: 0 auto;
    padding: 0 3rem;
  }
  .section-label {
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1rem;
  }
  .section-heading {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.25rem, 4vw, 3.25rem);
    font-weight: 300;
    line-height: 1.15;
    color: var(--brown-dark);
    margin-bottom: 4rem;
  }
  .section-heading em { font-style: italic; color: var(--accent); }

  /* ─── SKILLS ─── */
  #skills { background: var(--warm-white); }
  .skills-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1.5px;
    background: var(--border);
    border: 1.5px solid var(--border);
  }
  .skill-card {
    background: var(--warm-white);
    padding: 2.5rem 2.75rem;
    transition: background 0.25s;
  }
  .skill-card:hover { background: var(--cream); }
  .skill-card-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.35rem;
    font-weight: 600;
    color: var(--brown-dark);
    margin-bottom: 1.25rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--border);
  }
  .skill-list { list-style: none; }
  .skill-list li {
    font-size: 0.85rem;
    font-weight: 300;
    color: var(--text-soft);
    padding: 0.3rem 0;
    padding-left: 1rem;
    position: relative;
  }
  .skill-list li::before {
    content: '→';
    position: absolute; left: 0;
    color: var(--accent);
    font-size: 0.7rem;
    top: 0.35rem;
  }

  /* ─── EXPERIENCE ─── */
  #experience { background: var(--cream); }
  .timeline { position: relative; }
  .timeline::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 1px;
    background: linear-gradient(to bottom, transparent, var(--accent) 10%, var(--accent) 90%, transparent);
  }
  .timeline-item {
    padding: 0 0 4rem 3.5rem;
    position: relative;
  }
  .timeline-item:last-child { padding-bottom: 0; }
  .timeline-dot {
    position: absolute;
    left: -5px; top: 0.35rem;
    width: 11px; height: 11px;
    border-
